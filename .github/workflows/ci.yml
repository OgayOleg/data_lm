name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Линтинг и тесты
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (flake8)
        run: flake8 src tests scripts

      - name: Format check (black)
        run: black --check src tests scripts

      - name: Unit tests (pytest)
        run: pytest tests/ -v --cov=src --cov-report=term-missing

  pipeline-smoke:
    name: Smoke-тест пайплайна (Telco, без тюнинга)
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download datasets (checksum verified)
        run: python -m src.download

      - name: Run fast pipeline on Telco
        run: python -m src.pipeline --dataset telco --skip-tuning --skip-leakage-experiment

      - name: Check artefacts
        run: |
          test -f reports/metrics/telco_test_metrics.csv
          test -f models/telco_best_model.joblib

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: telco-artefacts
          path: |
            reports/
            models/
          retention-days: 7
