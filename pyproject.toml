[project]
name = "telco-bank-ml-pipeline"
version = "1.0.0"
description = "End-to-end ML pipeline for binary classification (Telco Churn + Bank Marketing)"
requires-python = ">=3.10"

[tool.black]
line-length = 110
target-version = ["py311"]
extend-exclude = '''
/(
    \.venv
  | notebooks
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]
